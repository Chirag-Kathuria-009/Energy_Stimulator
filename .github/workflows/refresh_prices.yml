name: refresh-prices

# Runs every morning without anybody watching. It proves that the pipeline still works against
# the live SMARD API and catches upstream format changes early: it fetches the price chunks,
# checks their layout, rebuilds the price models with dbt (21 tests) and runs the gold checks.
# The resulting database is kept as an artifact.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC, after the day-ahead prices for the next day are published
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      # On a fresh runner this downloads the price chunks of the simulation year (about 1 MB).
      - name: Refresh prices
        run: uv run ets refresh

      - name: Keep the database
        uses: actions/upload-artifact@v4
        with:
          name: energy-duckdb
          path: data/gold/energy.duckdb
          retention-days: 14
