# Price, OPSD, when2heat and BDEW URLs verified 2026-10-18 (DECISIONS.md items 1-5).
smard_base: https://www.smard.de/app/chart_data
smard_region: DE-LU
smard_price_filter: 4169            # day-ahead price DE-LU, EUR/MWh
smard_context_region: DE            # verified: index_quarterhour.json returns 200 under DE for all three
smard_context_filters: [410, 4068, 4067]   # optional context series (grid load, solar, wind)
smard_resolution: quarterhour

opsd_household_15min_url: https://data.open-power-system-data.org/household_data/2020-04-15/household_data_15min_singleindex.csv
# Values are cumulative kWh meter readings; see DECISIONS.md #3 for covered ranges.
opsd_channels:
  base_grid_import_r1: DE_KN_residential1_grid_import
  hp_r1: DE_KN_residential1_heat_pump
  pv_r1: DE_KN_residential1_pv
  base_grid_import_r4: DE_KN_residential4_grid_import
  hp_r4: DE_KN_residential4_heat_pump
  ev_r4: DE_KN_residential4_ev
  pv_r4: DE_KN_residential4_pv

# ~328 MB, ';' separated, DECIMAL COMMA (3,19). Hourly, 2007-12-31 to 2022-12-31 UTC.
# DE_heat_demand_* are empty from 2016 on, so the single-family-house *profile* columns are used
# (complete for all years, each sums to ~1,000,000 per year). DECISIONS.md #4.
when2heat_url: https://data.open-power-system-data.org/when2heat/2023-07-27/when2heat.csv
when2heat_columns:
  heat_profile_space: DE_heat_profile_space_SFH
  heat_profile_water: DE_heat_profile_water_SFH
  cop_space: DE_COP_ASHP_radiator     # air-source heat pump, radiator heating (ASSUMPTION)
  cop_water: DE_COP_ASHP_water

bdew_local_path: data/manual/bdew_slp_2025.xlsx
bdew_download_url: https://www.bdew.de/media/documents/Kopie_von_Repr%C3%A4sentative_Profile_BDEW_H25_G25_L25_P25_S25_Ver%C3%B6ffentlichung.xlsx
