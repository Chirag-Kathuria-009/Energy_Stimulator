# Supplier terms are shared by all dynamic variants (deviation from the plan's flat list,
# see DECISIONS.md). Variants only differ in the §14a module.
# The smart-meter fee depends on the household, so it lives in households.yaml.
supplier:
  name: Tibber (Smart Dynamic)         # ASSUMPTION: secondary source, see DECISIONS.md #8
  markup_ct_kwh: 1.81                  # 2.15 ct gross / 1.19 -> net; VAT is re-added in billing
  base_fee_eur_month: 5.99             # gross

variants:
  - id: fixed
    type: fixed
  - id: dynamic
    type: dynamic
  - id: dynamic_m1
    type: dynamic
    grid14a_module: 1
  - id: dynamic_m2
    type: dynamic
    grid14a_module: 2
  - id: dynamic_m3
    type: dynamic
    grid14a_module: 3
  - id: dynamic_m1_m3
    type: dynamic
    grid14a_module: [1, 3]
