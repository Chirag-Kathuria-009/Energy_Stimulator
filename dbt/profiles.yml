ets:
  target: dev
  outputs:
    dev:
      type: duckdb
      # ets transform exports ETS_DATA_DIR (absolute); the default is for running dbt by hand
      path: "{{ env_var('ETS_DATA_DIR', '../data') }}/gold/energy.duckdb"
      external_root: "{{ env_var('ETS_DATA_DIR', '../data') }}/silver"  # silver Parquet files
      threads: 4
